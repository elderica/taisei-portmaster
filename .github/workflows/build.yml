name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build in arm64 debian:bullseye
        run: docker run --rm -v "$PWD:/src" -w /src arm64v8/debian:bullseye bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: taisei
          path: dist/taisei.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/taisei.zip
